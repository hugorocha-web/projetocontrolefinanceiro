<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro</title>
    <link rel="stylesheet" href="estilos/mobilefirst.css">
    <link rel="stylesheet" href="estilos/outros.css" media="screen and (min-width: 791px)">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <header>
        <h1>Controle Financeiro</h1>
    </header>
    <main>
        <section id="secao1">
            <div id="saldo">
                <i class="fa-solid fa-circle-arrow-right"></i>
                <div>
                    <p>saldo</p>
                    <h2 id="dinsaldo">R$ 1.150,00</h2>
                </div>
            </div>
            <div id="entradas">
                <i class="fa-solid fa-arrow-up-long"></i>
                <div>
                    <p>entradas</p>
                    <h2 id="dinentradas">R$ 2.000,00</h2>
                </div>
            </div>
            <div id="despesas">
                <i class="fa-solid fa-arrow-down-long"></i>
                 <div>
                    <p>despesas</p>
                    <h2 id="dinsaida">R$ 850,00</h2>
                </div>
            </div>
        </section>
        <section id="secao2">
            <div id="grafico">
                <div id="alimentação">
                    <p>alimentação</p>
                    <div>
                        <div id="tamanhoalimentação"></div>
                    </div>
                    <div class="valor"><p>R$ 300</p></div>
                </div>
                <div id="transporte">
                    <p>transporte</p>
                    <div>
                        <div id="tamanhotransporte"></div>
                    </div>
                    <div class="valor"><p>R$ 150</p></div>
                </div>
                <div id="lazer">
                    <p>lazer</p>
                    <div>
                        <div id="tamanholazer"></div>
                    </div>
                    <div class="valor"><p>R$ 50</p></div>
                </div>
            </div>
            <button>
                <i class="fa-solid fa-plus"></i>
                <p>Nova Movimentação</p>
            </button>
        </section>
        <section id="secao3">
            <div id="btnsfiltros">
                <button>Todas</button>
                <button>Entradas</button>
                <button>Despesas</button>
            </div>
        </section>
        <section id="secao4">
            <div class="coisas">
                <div>
                    <i class="fa-solid fa-arrow-up-long"></i>
                    <div>
                        <p id="descrição">Salario</p>
                        <p>Entrada</p>
                    </div>
                </div>
                <p id="valorentrada">R$ 2000000,00</p>
            </div>
            <div class="coisas">
                <div>
                    <i class="fa-solid fa-arrow-down-long"></i>
                    <div>
                        <p id="descrição">academia</p>
                        <p>saida</p>
                    </div>
                </div>
                <p id="valorsaida">R$ 100,00</p>
            </div>
        </section>
    </main>
    <footer>

    </footer>
    <script src="scripts/script.js"></script>
</body>
</html>
